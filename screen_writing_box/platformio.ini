[platformio]
default_envs = esp32-s3-supermini

[env:esp32-s3-supermini]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_upload.flash_size = 4MB
board_build.flash_mode = dio
board_build.partitions = default.csv
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    bblanchon/ArduinoJson@6.21.5
build_flags =
    -D USER_SETUP_LOADED=1
    -D ILI9488_DRIVER=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480
    -include include/tft_setup.h
    -I include
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; Compile-only candidate with placeholder credentials. Never upload this environment.
[env:esp32-s3-build-check]
extends = env:esp32-s3-supermini
build_flags =
    ${env:esp32-s3-supermini.build_flags}
    -D FX9600_BUILD_CHECK=1
